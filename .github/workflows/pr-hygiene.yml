# The definition of done is mechanical: a PR closes exactly one issue, and every
# "Done when" box on that issue is ticked before merge.
name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  closes-issue:
    name: closes one issue · done-when ticked
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const refs = [...body.matchAll(/\b(?:closes|fixes|resolves)\s+#(\d+)/gi)].map(m => Number(m[1]));
            const unique = [...new Set(refs)];
            if (unique.length !== 1) {
              core.setFailed(`PR body must contain exactly one "Closes #N" (found ${unique.length}). One issue = one PR.`);
              return;
            }
            const issue_number = unique[0];
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
            if (issue.pull_request) { core.setFailed(`#${issue_number} is a PR, not an issue.`); return; }
            const ib = issue.body ?? "";
            if (!/^##\s+Done when/mi.test(ib)) {
              core.setFailed(`Issue #${issue_number} has no "## Done when" checklist. Add one before merging.`);
              return;
            }
            if (!issue.milestone) core.warning(`Issue #${issue_number} has no milestone.`);
            const unticked = [...ib.matchAll(/^\s*[-*]\s+\[ \]\s+(.*)$/gm)].map(m => m[1].trim());
            const ticked = [...ib.matchAll(/^\s*[-*]\s+\[[xX]\]/gm)].length;
            if (ticked === 0 && unticked.length === 0) {
              core.setFailed(`Issue #${issue_number}'s "Done when" has no checkboxes.`);
              return;
            }
            if (unticked.length > 0) {
              core.setFailed(`Issue #${issue_number} still has ${unticked.length} unticked "Done when" item(s):\n - ${unticked.join("\n - ")}\nTick each you satisfied (gh issue edit ${issue_number} --body ...) or say in the PR why it stays open.`);
              return;
            }
            core.info(`#${issue_number}: ${ticked} done-when item(s) ticked, milestone: ${issue.milestone?.title ?? "none"}.`);
